<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarNews — Einrichtung</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2d3348;
      --text: #e8eaf0;
      --muted: #9aa3b8;
      --accent: #5b8cff;
      --accent-hover: #7aa3ff;
      --err: #ff6b6b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6fb;
        --card: #ffffff;
        --border: #d8deea;
        --text: #1a1f2e;
        --muted: #5c667a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.75rem; }
    .subtitle { color: var(--muted); margin-bottom: 1.5rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 400;
      margin-top: -0.2rem;
      margin-bottom: 0.5rem;
    }
    input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .error-box {
      color: var(--err);
      font-size: 0.875rem;
      margin-top: 0.75rem;
      white-space: pre-wrap;
    }
    .note {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .examples {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 1rem;
    }
    .examples code {
      display: block;
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>StarNews — Einrichtung</h1>
    <p class="subtitle">Einmal den Ausgabeordner wählen — API-Keys sind bereits eingebaut.</p>

    <div class="card">
      <p class="note">Gespeichert in: <code>{{ config_local }}</code></p>
      <form id="setup-form">
        <label for="startv_root">StarTV Ordner (Ausgabe)</label>
        <p class="hint">Hier werden die Tagesordner erstellt, z. B. <code>29.07/skript.docx</code> und <code>29.07/assets/</code>.</p>
        <input type="text" id="startv_root" value="{{ startv_root }}" placeholder="/Users/Name/Documents/StarTV" required>

        <div class="examples">
          Beispiele:
          <code>Mac: /Users/Name/Documents/StarTV</code>
          <code>Windows: C:/Users/Name/Documents/StarTV</code>
        </div>

        <button type="submit" id="save-btn">Speichern &amp; starten</button>
        <div id="error" class="error-box"></div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("setup-form");
    const errorEl = document.getElementById("error");
    const saveBtn = document.getElementById("save-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      saveBtn.disabled = true;

      const payload = {
        startv_root: document.getElementById("startv_root").value.trim(),
      };

      try {
        const res = await fetch("/api/setup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Speichern fehlgeschlagen");
        }
        window.location.href = "/";
      } catch (err) {
        errorEl.textContent = String(err);
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
